<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AI STORE</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root {
    --bg: #0f1428;
    --card: #1b2238;
    --line: #2d3652;
    --gold: #f2b93b;
    --gold-deep: #7a4a14;
    --text: #f1f3fa;
    --muted: #8d96b2;
  }
  * { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
  body {
    background: var(--bg); color: var(--text);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    padding: 16px 16px 40px; max-width: 520px; margin: 0 auto;
  }
  .wallet {
    background: linear-gradient(135deg, #2b3350 0%, #1b2238 60%);
    border: 1px solid #4a4230; border-radius: 22px; padding: 18px 18px 20px;
  }
  .who { color: var(--muted); font-size: 14px; }
  .bal { font-size: 40px; font-weight: 800; color: var(--gold); margin-top: 6px; letter-spacing: -0.5px; }
  .bal small { font-size: 16px; font-weight: 600; margin-left: 6px; }
  h2 { font-size: 20px; margin: 26px 0 12px; }
  .games { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .game {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 16px;
    padding: 18px 6px 14px; text-align: center; font-size: 13px; color: var(--text); cursor: pointer;
  }
  .game .ic { font-size: 30px; display: block; margin-bottom: 8px; }
  .game.on { border-color: var(--gold); background: #262a3a; }
  .pack {
    display: flex; justify-content: space-between; align-items: center; width: 100%;
    background: var(--card); border: 1px solid var(--line); border-radius: 14px;
    padding: 16px; margin-bottom: 10px; color: var(--text); font-size: 16px; cursor: pointer; text-align: left;
  }
  .pack b { color: var(--gold); font-weight: 700; white-space: nowrap; margin-left: 12px; }
  .pack:active, .game:active { transform: scale(.98); }
  .pack.low b { color: var(--muted); }
  .note { color: var(--muted); font-size: 13px; margin-top: 14px; line-height: 1.5; }
  #sheet {
    position: fixed; inset: auto 0 0 0; background: #151b30; border-top: 1px solid var(--gold);
    border-radius: 22px 22px 0 0; padding: 20px 18px calc(22px + env(safe-area-inset-bottom, 0px));
    transform: translateY(110%); transition: transform .25s ease; max-width: 520px; margin: 0 auto;
  }
  #sheet.open { transform: translateY(0); }
  #sheet h3 { font-size: 18px; margin-bottom: 4px; }
  #sheet p { color: var(--muted); margin-bottom: 16px; }
  .row { display: flex; gap: 10px; }
  .btn { flex: 1; border: 0; border-radius: 14px; padding: 15px; font-size: 16px; font-weight: 700; cursor: pointer; }
  .btn.go { background: linear-gradient(90deg, #f2b93b, #a8691d); color: #1a1205; }
  .btn.no { background: var(--card); color: var(--text); }
  @media (prefers-reduced-motion: reduce) { #sheet { transition: none; } }
</style>
</head>
<body>

<div class="wallet">
  <div class="who" id="who">Mehmon</div>
  <div class="bal"><span id="bal">0</span><small>UZS</small></div>
</div>

<h2>O'yinlar</h2>
<div class="games" id="games"></div>

<h2 id="ptitle">Paketni tanlang</h2>
<div id="packs"></div>
<p class="note" id="note"></p>

<div id="sheet">
  <h3 id="sname"></h3>
  <p id="sprice"></p>
  <div class="row">
    <button class="btn no" id="cancel">Bekor qilish</button>
    <button class="btn go" id="confirm">Davom etish</button>
  </div>
</div>

<script>
  // Narxlar bot kodidagi PRODUCTS bilan bir xil bo'lishi shart!
  const PRODUCTS = {
    pubg: { name: "PUBG Mobile", icon: "🎮", items: [["60 UC", 13000], ["325 UC", 65000], ["660 UC", 130000]] },
    ml:   { name: "Mobile Legends", icon: "💎", items: [["86 almaz", 18000], ["172 almaz", 36000], ["Haftalik pass", 30000]] },
    ff:   { name: "Free Fire", icon: "🔥", items: [["100 almaz", 12000], ["310 almaz", 35000], ["Haftalik obuna", 28000]] }
  };

  const tg = window.Telegram && window.Telegram.WebApp;
  if (tg) { tg.ready(); tg.expand(); tg.setHeaderColor("#0f1428"); tg.setBackgroundColor("#0f1428"); }

  const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, " ");
  const balance = parseInt(new URLSearchParams(location.search).get("b") || "0", 10) || 0;
  document.getElementById("bal").textContent = fmt(balance);
  if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
    document.getElementById("who").textContent = tg.initDataUnsafe.user.first_name;
  }

  let game = "pubg", picked = null;
  const gamesEl = document.getElementById("games");
  const packsEl = document.getElementById("packs");

  function drawGames() {
    gamesEl.innerHTML = "";
    Object.entries(PRODUCTS).forEach(([k, g]) => {
      const b = document.createElement("button");
      b.className = "game" + (k === game ? " on" : "");
      b.innerHTML = `<span class="ic">${g.icon}</span>${g.name}`;
      b.onclick = () => { game = k; drawGames(); drawPacks(); };
      gamesEl.appendChild(b);
    });
  }

  function drawPacks() {
    packsEl.innerHTML = "";
    PRODUCTS[game].items.forEach(([name, price], i) => {
      const b = document.createElement("button");
      b.className = "pack" + (balance < price ? " low" : "");
      b.innerHTML = `<span>${name}</span><b>${fmt(price)} UZS</b>`;
      b.onclick = () => openSheet(i);
      packsEl.appendChild(b);
    });
    document.getElementById("note").textContent =
      "Tanlagandan keyin botda o'yin ID raqamingizni yozasiz. Pul balansdan yechiladi.";
  }

  const sheet = document.getElementById("sheet");
  function openSheet(i) {
    picked = i;
    const [name, price] = PRODUCTS[game].items[i];
    document.getElementById("sname").textContent = PRODUCTS[game].name + " — " + name;
    document.getElementById("sprice").textContent =
      balance >= price ? "Narxi: " + fmt(price) + " UZS"
                       : "Balans yetarli emas. Avval botda hamyonni to'ldiring.";
    sheet.classList.add("open");
  }
  document.getElementById("cancel").onclick = () => sheet.classList.remove("open");
  document.getElementById("confirm").onclick = () => {
    const data = JSON.stringify({ k: game, i: picked });
    if (tg) tg.sendData(data); else alert("Telegram ichida oching.");
  };

  drawGames(); drawPacks();
</script>
</body>
</html>
